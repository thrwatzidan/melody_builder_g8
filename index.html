<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مُهندس الألحان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1e293b;--or:#ff8a3d;--pu:#7c5cff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0}
body{font-family:Cairo,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(#bfe6ff,#fff3c4);min-height:100%;padding:10px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(22px,5vw,36px);font-weight:900;color:var(--pu);line-height:1.3}
h1 small{display:block;font-size:.42em;color:#475569;font-weight:700}
.by{font-size:.36em;background:var(--pu);color:#fff;padding:3px 12px;border-radius:20px;margin-inline-start:8px;vertical-align:middle;white-space:nowrap}
#stars{font-size:clamp(26px,6vw,36px);color:#f59e0b;letter-spacing:2px;white-space:nowrap}
.card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 6px 0 #00000014;border:3px solid #fff}
.card h2{margin:2px 4px 6px;font-size:clamp(15px,3.6vw,18px)}
svg{width:100%;height:auto;display:block;direction:ltr}
#msg{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;border:3px solid #a78bfa;padding:8px 12px;font-weight:700;font-size:clamp(14px,3.5vw,18px);min-height:56px}
#msg:before{content:"🦉";font-size:34px}
#msg.bad{border-color:#ef4444;background:#fff1f2}
#msg.good{border-color:#22c55e;background:#f0fdf4}
.navrow{display:flex;gap:6px;align-items:center}
#nav{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.nb{flex:1;max-width:42px;aspect-ratio:1;min-width:0;border-radius:50%;border:2px solid #fff;background:#e2e8f0;font:900 clamp(11px,3vw,16px) Cairo;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #0002;padding:0}
.nb.done{background:#86efac}.nb.cur{background:#fbbf24;transform:scale(1.15)}
.ar{width:38px;height:38px;padding:0;flex:none;border-radius:12px;font-size:15px}
button{font:900 15px Cairo;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--pu);box-shadow:0 4px 0 #4c35b8}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #4c35b8}
button:focus-visible,.key:focus-visible,.nb:focus-visible{outline:4px solid #f59e0b}
button:disabled{opacity:.4;cursor:not-allowed}
.b2{background:#0ea5e9;box-shadow:0 4px 0 #0369a1}.b3{background:#94a3b8;box-shadow:0 4px 0 #475569}
.b2.on{background:#f97316;box-shadow:0 4px 0 #9a3412}
.tools{display:flex;gap:6px}
.tools button{flex:1;padding:8px 4px;font-size:clamp(12px,3.3vw,15px);box-shadow:0 3px 0 #0003;white-space:nowrap}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.hd2 button{padding:6px 10px;font-size:13px;box-shadow:0 3px 0 #0003}
.fv #work,.fv .mo,.fv .navrow,body:not(.fv) #full,body:not(.fv) .fo{display:none}
#kb{position:relative;display:flex;direction:ltr;gap:3px;height:200px;background:#1e293b;padding:10px 10px 0;border-radius:18px 18px 10px 10px;box-shadow:0 6px 0 #0f172a}
.key{flex:1;min-width:0;background:linear-gradient(#fff,#e8eef6);border:2px solid #334155;border-radius:0 0 12px 12px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;cursor:pointer;touch-action:none;font:900 clamp(13px,3.4vw,20px) Cairo;color:#1e293b}
.key i{width:clamp(16px,4vw,24px);height:clamp(16px,4vw,24px);border-radius:50%;margin-bottom:6px;border:2px solid #fff;box-shadow:0 2px 0 #0003}
.key.down{background:linear-gradient(#fde68a,#fbbf24);transform:translateY(4px)}
.key.dim{opacity:.3;pointer-events:none}
.bk{position:absolute;top:10px;width:7%;height:62%;background:linear-gradient(#475569,#020617);border-radius:0 0 8px 8px;z-index:2;pointer-events:none}
.ball{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 20px Cairo;border:4px solid #fff;box-shadow:0 5px 0 #0003}
.ghostball{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.15)}
.g2{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#play{background:#16a34a;box-shadow:0 4px 0 #166534;font-size:18px}
.inst{background:#64748b;box-shadow:0 4px 0 #334155}.inst.on{background:var(--or);box-shadow:0 4px 0 #b45309}
.bar{height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#fbbf24);transition:width .3s}
ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-weight:700;font-size:14px}
@media(max-width:900px){#kb{position:sticky;bottom:6px;z-index:10}#stage{order:1}#kb{order:2}#toolscard{order:3}#stripcard{order:4}.g2{order:5}}
@media(max-width:640px){body{padding:6px}.card{padding:8px;border-radius:16px}.g2{grid-template-columns:1fr}#kb{height:150px;padding:8px 6px 0}.bk{top:8px}.key{border-radius:0 0 9px 9px;padding-bottom:5px}}
.nt.playing .hd{filter:drop-shadow(0 0 8px #f59e0b)}
.hl{opacity:0}.nt.playing .hl{opacity:1}
.pulse{animation:pl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.15);opacity:.65}}
.wob{animation:wob .22s linear infinite}
@keyframes wob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.nx{animation:bn .8s ease-in-out infinite}
@keyframes bn{50%{transform:scale(1.1)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
input{-webkit-user-select:text;user-select:text;font:700 16px Cairo;padding:8px 10px;border:2px solid #cbd5e1;border-radius:10px;width:100%}
a.btn{font:900 15px Cairo;text-decoration:none;border-radius:14px;padding:10px 14px;color:#fff;background:#ea4335;box-shadow:0 4px 0 #a52714;display:inline-block}
#mail{position:fixed;inset:0;background:#0009;z-index:80;display:none;place-items:center;padding:12px;overflow:auto}
#mail .card{max-width:480px;width:100%}
#mail ol{padding-inline-start:20px;margin:8px 0;font-weight:700;font-size:14px;display:block}
.cp{text-align:center;font-size:12px;color:#64748b;font-weight:700}
@media print{body{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🎼 مُهندس الألحان <span class="by">إعداد أ/ ثروت ذيدان</span><small>ابنِ لحنك نغمةً نغمة</small></h1><div id="stars">☆☆☆</div></header>
<div id="msg">اضغط على أي مفتاح في البيانو لتضع النغمة في المكان المضيء. أو اسحب المفتاح إلى المكان الذي تريده!</div>

<section class="card" id="stripcard">
 <div class="hd2"><h2>📐 شيفرة الإيقاع (المس مازورة للانتقال إليها)</h2><div class="row" style="margin:0"><button class="b2" id="swap">🔀 بدّل الإيقاعات</button><button class="b3" id="reset">↩ الترتيب الأصلي</button></div></div>
 <svg id="strip" viewBox="0 0 1100 230"></svg>
</section>

<section class="card" id="stage">
 <h2 id="mt"></h2>
 <svg id="work" viewBox="0 0 900 270"></svg>
 <svg id="full" viewBox="0 0 1100 300"></svg>
 <div class="navrow"><button class="ar" id="prev" aria-label="السابقة">➡</button><div id="nav"></div><button class="ar" id="next" aria-label="التالية">⬅</button></div>
</section>

<div id="kb" aria-label="لوحة مفاتيح البيانو"></div>

<section class="card" id="toolscard"><div class="tools">
  <button class="b2 mo" id="hear">🔊 اسمع</button><button class="b3 mo" id="help">💡 ساعدني</button><button class="b3 mo" id="clr">🧹 مسح</button><button class="b3 mo" id="tofull">🎼 اللحن</button>
  <button class="fo" id="play2" style="background:#16a34a;box-shadow:0 3px 0 #166534">▶ اعزف</button><button class="b3 fo" id="edit">✏️ عدّل</button>
</div></section>

<div class="g2">
 <section class="card"><h2>⭐ لوحة النجوم</h2><div id="eval"></div><div class="row"><button id="play">▶ اعزف لحني كاملاً</button></div></section>
 </div>
<p class="cp">© إعداد أ/ ثروت ذيدان — جميع الحقوق محفوظة</p>
</div>
